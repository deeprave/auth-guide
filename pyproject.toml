[project]
name = "auth-guide"
version = "0.1.0"
description = "Reference OIDC provider service and administration CLI"
readme = "README.md"
authors = [
    { name = "David Nugent", email = "davidn@uniquode.io" }
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "tortoise-sqlcipher>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["I", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["auth_guide"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "ruff>=0.13.2",
    "ty",
    "pre-commit>=4.0.0",
    "watchdog>=6.0.0",
    "bandit>=1.9.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.16.2",
]

[project]
name = "auth-guide"
version = "0.1.0"
description = "Reference OIDC provider service and administration CLI"
readme = "README.md"
authors = [
    { name = "David Nugent", email = "davidn@uniquode.io" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/auth_guide",
    "--cov-report=term-missing",
]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["I", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["auth_guide"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
error-on-warning = true

[tool.vulture]
exclude = ["tests/"]
min_confidence = 60

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "coverage>=7.10.7",
    "ruff>=0.13.2",
    "ty",
    "pre-commit>=4.0.0",
    "watchdog>=6.0.0",
    "bandit>=1.9.2",
    "pyright>=1.1.407",
    "osvcheck>=1.0.0b1",
    "vulture>=2.14",
]
